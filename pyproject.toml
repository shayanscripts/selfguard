[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfguard"
version = "0.1.0"
description = "Behavioral signals for post-generation prompt-injection detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shayan"}]
keywords = ["llm", "prompt-injection", "ai-safety", "behavioral-drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "sentence-transformers>=3,<6",
  "requests>=2.28,<3",
]

[project.optional-dependencies]
openai = ["openai>=1,<3"]
anthropic = ["anthropic>=0.20,<1"]
huggingface = ["transformers>=4.41,<6", "torch>=2.4", "accelerate>=0.30"]
research = ["pandas>=2,<4", "scikit-learn>=1.3,<2", "tqdm>=4.66,<5", "joblib>=1.3,<2"]
all = [
  "openai>=1,<3",
  "anthropic>=0.20,<1",
  "transformers>=4.41,<6",
  "torch>=2.4",
  "accelerate>=0.30",
]
dev = ["build>=1,<2", "twine>=5,<7"]

[project.urls]
Documentation = "https://github.com/shayanscripts/selfguard#readme"
Repository = "https://github.com/shayanscripts/selfguard"
Issues = "https://github.com/shayanscripts/selfguard/issues"

[tool.setuptools.packages.find]
include = ["selfguard*"]
