name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -e ".[huggingface,plugin]"

      - name: Verify Signal 4 dependency is active
        run: python -c "import torch; print('PyTorch', torch.__version__)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate notebooks without executing them
        run: python scripts/validate_notebooks.py

  package:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install --upgrade pip numpy
          wheel-check/bin/python -m pip install --no-deps dist/*.whl
          wheel-check/bin/python -c "import importlib.metadata, selfguard; assert selfguard.__version__ == importlib.metadata.version('selfguard')"
